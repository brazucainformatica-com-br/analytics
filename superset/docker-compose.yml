# LineaSuite BI (Apache Superset) — implantação no srv1
# Todos os serviços ficam em rede interna do Docker; só a aplicação publica a porta 8088,
# e apenas em 127.0.0.1 (o Apache do Virtualmin faz o proxy HTTPS).
# A MariaDB do host é acessada pelo socket Unix montado em /run/mysqld (sem expor a 3306).

x-superset: &superset
  image: lineasuite-bi:${SUPERSET_VERSION:-6.1.0}
  build:
    context: .
    args:
      SUPERSET_IMAGE: ${SUPERSET_IMAGE:-apache/superset:6.1.0}
      SUPERSET_VERSION: ${SUPERSET_VERSION:-6.1.0}
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./config:/app/pythonpath:ro
    - ./assets:/app/superset/static/assets/brazuca:ro
    - superset_home:/app/superset_home
    - /run/mysqld:/run/mysqld

services:
  db:
    image: postgres:17
    container_name: bi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: bi_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  superset-init:
    <<: *superset
    container_name: bi_init
    restart: "no"
    command: ["/app/pythonpath/init.sh"]
    profiles: ["init"]
    healthcheck:
      disable: true

  superset:
    <<: *superset
    container_name: bi_app
    command: ["/app/docker/entrypoints/run-server.sh"]
    ports:
      - "127.0.0.1:${BI_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g

  superset-worker:
    <<: *superset
    container_name: bi_worker
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "-O", "fair", "-l", "INFO", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s
    mem_limit: 2g

  superset-beat:
    <<: *superset
    container_name: bi_beat
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat", "--pidfile", "/tmp/celerybeat.pid", "-l", "INFO", "-s", "/app/superset_home/celerybeat-schedule"]
    healthcheck:
      disable: true
    mem_limit: 256m

volumes:
  db_data:
  redis_data:
  superset_home:
